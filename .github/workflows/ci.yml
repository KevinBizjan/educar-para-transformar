name: CI

# Integración continua: se ejecuta en cada Pull Request y en cada push a main.
# Si algo falla, el check queda en rojo en el PR antes de mergear.
on:
  pull_request:
  push:
    branches: [main]

# Si se sube un commit nuevo a la misma rama, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Lint (ESLint)
        run: npm run lint
      - name: Build (Vite)
        run: npm run build
      # Gestión de artefactos: el build queda guardado y descargable desde la ejecución.
      - name: Guardar el build como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  backend:
    name: Backend (pruebas contra PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Base descartable: contraseña y clave JWT aleatorias en cada ejecución.
      # Se usa el PostgreSQL que ya trae instalado el runner (no hay que descargar una imagen
      # de Docker, que era el paso más lento del pipeline: 9 a 17 s).
      # Nunca se toca la base de Supabase y no hay secretos escritos en el repositorio.
      - name: Iniciar PostgreSQL de prueba (preinstalado en el runner)
        working-directory: .
        run: |
          DB_PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$DB_PASS"
          sudo systemctl start postgresql.service
          for i in $(seq 1 30); do
            sudo -u postgres psql -qtAc 'select 1' >/dev/null 2>&1 && break
            sleep 1
          done
          sudo -u postgres psql -v ON_ERROR_STOP=1 -qc "ALTER USER postgres WITH PASSWORD '$DB_PASS'"
          JWT="$(openssl rand -hex 24)"
          echo "::add-mask::$JWT"
          {
            echo "DATABASE_URL=postgresql://postgres:${DB_PASS}@localhost:5432/postgres"
            echo "DATABASE_SSL=false"
            echo "JWT_SECRET=${JWT}"
          } >> "$GITHUB_ENV"

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Cargar datos de prueba (aplica el esquema y siembra)
        run: node seed.js
      - name: Pruebas automáticas
        run: npm test

  # Pruebas de extremo a extremo (HU13): Cypress maneja un navegador real contra la aplicación completa, igual que en
  # producción (el backend sirve el frontend compilado por el job "frontend") y con su propia base descartable.
  # El comprobante de pago necesita Supabase Storage, que no existe acá: ese tramo lo cubren las pruebas del backend.
  e2e:
    name: E2E (Cypress contra la app completa)
    runs-on: ubuntu-latest
    needs: frontend
    env:
      PORT: 3917
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar PostgreSQL de prueba (preinstalado en el runner)
        run: |
          DB_PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$DB_PASS"
          sudo systemctl start postgresql.service
          for i in $(seq 1 30); do
            sudo -u postgres psql -qtAc 'select 1' >/dev/null 2>&1 && break
            sleep 1
          done
          sudo -u postgres psql -v ON_ERROR_STOP=1 -qc "ALTER USER postgres WITH PASSWORD '$DB_PASS'"
          JWT="$(openssl rand -hex 24)"
          echo "::add-mask::$JWT"
          {
            echo "DATABASE_URL=postgresql://postgres:${DB_PASS}@localhost:5432/postgres"
            echo "DATABASE_SSL=false"
            echo "JWT_SECRET=${JWT}"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      # El build que ya compiló el job "frontend": lo que se prueba es lo mismo que se publicaría.
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Instalar el backend y cargar los datos de prueba
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          node seed.js

      # El servidor queda corriendo en segundo plano y se espera a que /api/health responda (hasta 60 s).
      - name: Arrancar la aplicación
        run: |
          nohup npm start --prefix backend > servidor.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://127.0.0.1:3917/api/health >/dev/null && echo "La aplicación respondió a los ${i} s" && exit 0
            sleep 1
          done
          echo "La aplicación no respondió. Log del servidor:"
          cat servidor.log
          exit 1

      # Instala Cypress (con su caché) y corre todas las pruebas contra la aplicación que ya está arriba.
      - name: Pruebas E2E
        uses: cypress-io/github-action@v6

      - name: Guardar las capturas si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-capturas
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7
