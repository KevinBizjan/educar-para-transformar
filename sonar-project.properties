# SonarCloud (orquestador de calidad). Completar los dos valores entre < > con los de la cuenta del equipo
# al importar el repositorio en sonarcloud.io, y agregar el secreto SONAR_TOKEN en GitHub.
# Cobertura: backend/coverage/lcov.info se genera con
#   node --test --experimental-test-coverage --test-coverage-include="src/**/*.js" \
#        --test-reporter=lcov --test-reporter-destination=coverage/lcov.info tests/*.test.js   (dentro de backend/)
sonar.organization=<organizacion-en-sonarcloud>
sonar.projectKey=<organizacion>_educar-para-transformar
sonar.projectName=Educar para Transformar
sonar.sources=backend/src,frontend/src,mobile/src
sonar.tests=backend/tests,cypress
sonar.exclusions=**/node_modules/**,frontend/dist/**,**/*.test.js,**/*.cy.js
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
